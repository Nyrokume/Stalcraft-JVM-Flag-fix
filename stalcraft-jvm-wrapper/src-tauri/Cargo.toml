[package]
name = "stalcraft-jvm-wrapper"
version = "1.7.3"
description = "STALZONE JVM Wrapper — IFEO JVM tuning for Windows"
authors = []
license = "MIT"
repository = ""
edition = "2021"
default-run = "stalcraft-jvm-wrapper"

[lib]
name = "stalcraft_jvm_wrapper"
path = "src/lib.rs"

[[bin]]
name = "stalcraft-jvm-wrapper"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "service"
path = "src/bin/service.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[features]
default = ["gui", "custom-protocol"]
gui = ["dep:tauri", "dep:tauri-plugin-dialog"]
custom-protocol = ["tauri/custom-protocol"]
